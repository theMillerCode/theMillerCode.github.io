<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Trade Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1115;
    --panel:#181B21;
    --panel-2:#1F232B;
    --line:#2A2F38;
    --text:#E7E9ED;
    --muted:#8B92A0;
    --brass:#C98A3B;
    --brass-dim:#8A6230;
    --pass:#35B88A;
    --warn:#E3B341;
    --breach:#E0554F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
  body{padding-bottom:76px;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;}

  header.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0F1115 80%,rgba(15,17,21,0));padding:18px 16px 10px;}
  header.top .brand{display:flex;align-items:center;justify-content:space-between;}
  header.top .brand .mark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:0.02em;}
  header.top .brand .mark span{color:var(--brass);}
  header.top .sub{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}

  .screen{padding:4px 16px 24px;}
  .hidden{display:none !important;}

  /* Gauge card */
  .gauge-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .gauge-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .gauge-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .gauge-value{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  .gauge-track{height:10px;border-radius:6px;background:#0B0D11;border:1px solid var(--line);overflow:hidden;display:flex;}
  .gauge-fill{height:100%;transition:width .3s ease;}
  .seg-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .seg-pill{font-size:10px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);}

  /* Cards / sections */
  .section{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;}
  .section-head{padding:12px 14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);border-bottom:1px solid var(--line);}
  .section-body{padding:14px;display:flex;flex-direction:column;gap:12px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.03em;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:10px 11px;border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:14.5px;
  }
  .field textarea{resize:vertical;min-height:52px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass-dim);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .row2 > input, .row2 > select, .row3 > input, .row3 > select{min-width:0;width:100%;}
  .helptext{font-size:10.5px;color:var(--muted);margin-top:4px;}
  .checkline{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text);}
  .checkline input{width:auto;}

  /* Gates */
  .gate{border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.4;margin-bottom:8px;border:1px solid transparent;}
  .gate.warn{background:rgba(227,179,65,0.1);border-color:rgba(227,179,65,0.4);color:#F0CE7A;}
  .gate.breach{background:rgba(224,85,79,0.12);border-color:rgba(224,85,79,0.45);color:#F19A96;}
  .gate .gt-title{font-weight:600;font-family:'Space Grotesk',sans-serif;margin-bottom:2px;display:flex;gap:6px;align-items:center;}

  .ack{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--muted);margin-top:6px;}
  .ack input{margin-top:2px;}

  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.02em;border:none;cursor:pointer;}
  .btn-primary{background:var(--brass);color:#171006;}
  .btn-primary:disabled{background:#4A3D25;color:#8A7B5C;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn-small{padding:8px 12px;font-size:12px;border-radius:6px;}

  /* Ticket / log cards */
  .ticket{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;position:relative;}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .ticket-sym{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;}
  .ticket-meta{color:var(--muted);font-size:11px;margin-top:2px;}
  .status-pill{font-size:10px;padding:3px 9px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
  .status-open{background:rgba(53,184,138,0.15);color:var(--pass);border:1px solid rgba(53,184,138,.4);}
  .status-closed{background:rgba(139,146,160,0.15);color:var(--muted);border:1px solid var(--line);}
  .kebab-wrap{position:relative;}
  .kebab-btn{background:none;border:none;color:var(--muted);font-size:19px;padding:2px 8px;cursor:pointer;line-height:1;letter-spacing:2px;}
  .kebab-menu{position:absolute;top:26px;right:0;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;z-index:15;min-width:160px;box-shadow:0 6px 18px rgba(0,0,0,.45);}
  .kebab-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:11px 13px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;cursor:pointer;}
  .kebab-menu button:active{background:rgba(255,255,255,.06);}
  .kebab-menu button.danger{color:var(--breach);}
  .kebab-menu .divider{border-top:1px solid var(--line);}
  .stamp{display:inline-block;margin-left:8px;transform:rotate(-3deg);font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border:1.5px solid;border-radius:4px;opacity:.85;vertical-align:middle;}
  .stamp.cleared{color:var(--pass);border-color:var(--pass);}
  .stamp.override{color:var(--breach);border-color:var(--breach);}

  .ticket-body{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px;}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px;}
  .kv div span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;}

  .roll-item{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;}
  .roll-item .rd{color:var(--muted);font-size:10px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-box{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center;}
  .stat-box .num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;}
  .stat-box .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}
  .bucket-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;gap:8px;}
  .bucket-row:last-child{border-bottom:none;}
  .bucket-row .name{font-family:'Space Grotesk',sans-serif;font-weight:600;flex-shrink:0;}
  .bucket-row .stats{color:var(--muted);font-size:10.5px;text-align:right;}
  .subtab-btn{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);padding:9px;border-radius:6px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:11.5px;cursor:pointer;letter-spacing:.02em;}
  .subtab-btn.active{background:var(--brass);color:#171006;border-color:var(--brass);}
  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:30px 10px;}

  /* Bottom nav */
  nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#12141A;border-top:1px solid var(--line);}
  nav.bottom .inner{max-width:520px;margin:0 auto;display:flex;}
  nav.bottom button{flex:1;background:none;border:none;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:.03em;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
  nav.bottom button.active{color:var(--brass);}
  nav.bottom .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0;}
  nav.bottom button.active .dot{opacity:1;}

  select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238B92A0'/></svg>");background-repeat:no-repeat;background-position:right 12px center;}

  .settings-toggle{font-size:11px;color:var(--muted);text-align:right;margin-bottom:8px;text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="mark">TRADE<span>DESK</span></div>
      <div class="mark" id="dateNow" style="font-size:11px;color:var(--muted);font-weight:400;"></div>
    </div>
    <div class="sub" id="viewLabel">New Ticket</div>
  </header>

  <div class="screen">

    <!-- TICKET VIEW -->
    <div id="view-ticket">

      <div class="gauge-card" id="liveGauges"></div>

      <div class="section">
        <div class="section-head">Identity</div>
        <div class="section-body">
          <div class="row2">
            <div class="field"><label>Symbol</label><input id="f_symbol" placeholder="XLE" style="text-transform:uppercase"></div>
            <div class="field"><label>Contracts</label><input id="f_contracts" type="number" min="1" step="1" value="1"></div>
          </div>
          <div class="row2">
            <div class="field"><label>Sector</label>
              <select id="f_sector">
                <option>Retail</option><option>Financials</option><option>Energy</option>
                <option>Technology</option><option>Healthcare</option><option>Industrials</option>
                <option>Consumer Staples</option><option>Consumer Discretionary</option>
                <option>Materials</option><option>Utilities</option><option>Real Estate</option>
                <option>Communication Services</option><option>Other</option>
              </select>
            </div>
            <div class="field"><label>Strategy type</label>
              <select id="f_strategy">
                <option>IVR Mean-Reversion Spread</option>
                <option>Wheel</option>
                <option>PMCC Repair</option>
                <option>Orderflow-Directional</option>
                <option>Other</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">Vol Case</div>
        <div class="section-body">
          <div class="row2">
            <div class="field"><label>Current IVR (%)</label><input id="f_ivr" type="number" placeholder="45"></div>
            <div class="field"><label>Why elevated?</label>
              <select id="f_ivrReason">
                <option value="statistical">Statistical / mean-reversion</option>
                <option value="earnings">Earnings-driven</option>
                <option value="news">Other news-driven</option>
              </select>
            </div>
          </div>
          <div class="row2">
            <div class="field"><label>Days to earnings</label><input id="f_daysEarnings" type="number" placeholder="120"></div>
            <div class="field"><label>Days to expiration</label><input id="f_daysExp" type="number" placeholder="60"></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">Mechanics</div>
        <div class="section-body">
          <div class="row2">
            <div class="field"><label>Underlying price</label><input id="f_price" type="number" step="0.01" placeholder="102.40"></div>
            <div class="field"><label>Option delta</label><input id="f_delta" type="number" step="0.01" placeholder="0.30"></div>
          </div>
          <div class="field"><label>ATM call cost, ~9mo out (per contract $)</label><input id="f_callcost" type="number" step="0.01" placeholder="2860"></div>
          <div class="field"><label>Position structure</label>
            <select id="f_structure">
              <option value="defined">Defined-risk (spread with long leg)</option>
              <option value="naked">Naked / undefined-risk (single leg)</option>
            </select>
          </div>
          <div class="row2">
            <div class="field"><label>Option type</label>
              <select id="f_optiontype"><option value="put">Put</option><option value="call">Call</option></select>
            </div>
            <div class="field"><label>Expiration date</label><input id="f_expdate" type="date"></div>
          </div>
          <div class="row2">
            <div class="field" id="wrap_shortstrike"><label id="lbl_shortstrike">Short strike</label><input id="f_shortstrike" type="number" step="0.5" placeholder="120"></div>
            <div class="field hidden" id="wrap_longstrike"><label>Long strike</label><input id="f_longstrike" type="number" step="0.5" placeholder="115"></div>
          </div>
          <div class="row2">
            <div class="field"><label>Support/resistance level?</label>
              <select id="f_haslevel"><option value="yes">Yes</option><option value="no">No clear level</option></select>
            </div>
            <div class="field"><label>Level price</label><input id="f_levelprice" type="number" step="0.01" placeholder="—"></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">Thesis &amp; Plan</div>
        <div class="section-body">
          <div class="field"><label>One-sentence thesis</label><textarea id="f_thesis" placeholder="IVR is in the 80th percentile with no earnings in the window; selling premium expecting IV compression."></textarea></div>
          <div class="row3">
            <div class="field"><label>Credit / premium collected (per contract $)</label><input id="f_entry" type="number" step="0.01" placeholder="85"></div>
            <div class="field"><label>Profit target (% of premium)</label><input id="f_target" type="number" step="1" placeholder="100"></div>
            <div class="field"><label>Adj./roll trigger (price)</label><input id="f_stop" type="number" step="0.01"></div>
          </div>
          <div class="helptext" id="targetHint">Default: 100% for weekly/biweekly wheel trades, 50% for ~45-day spreads — edit as needed.</div>
          <div class="field"><label>Position size (% of account risked)</label><input id="f_size" type="number" step="0.1" placeholder="2.5"></div>
        </div>
      </div>

      <div id="gatesBox"></div>

      <button class="btn btn-primary" id="submitTicket">Log Ticket</button>
    </div>

    <!-- LOG VIEW -->
    <div id="view-log" class="hidden">
      <div id="logList"></div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="view-dash" class="hidden">
      <div class="section-head" style="border:none;padding-left:0;">Leverage Budget</div>
      <div class="gauge-card" id="dashLeverage" style="margin-top:6px;"></div>
      <div class="section-head" style="border:none;padding-left:0;">Sector Exposure</div>
      <div class="gauge-card" id="dashSector" style="margin-top:6px;"></div>

      <div class="section" style="margin-top:16px;">
        <div class="section-head">Settings</div>
        <div class="section-body">
          <div class="row2">
            <div class="field"><label>Account cash ($)</label><input id="s_cash" type="number"></div>
            <div class="field"><label>Leverage cap (%)</label><input id="s_cap" type="number"></div>
          </div>
          <div class="field"><label>Sector concentration warn threshold (%)</label><input id="s_sector" type="number"></div>
          <div class="field"><label>Low IVR threshold (%)</label><input id="s_ivr" type="number"></div>
          <button class="btn btn-ghost" id="saveSettings">Save Settings</button>
          <div style="border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;">
            <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:8px;">Manual backup — your data lives in this browser only. Export before switching devices or clearing browser data.</label>
            <div class="row2">
              <button class="btn btn-ghost btn-small" id="exportData">Export data (.json)</button>
              <button class="btn btn-ghost btn-small" id="importTrigger">Import data (.json)</button>
            </div>
            <input type="file" id="importFile" accept="application/json" class="hidden">
          </div>
        </div>
      </div>
    </div>

    <!-- STATS VIEW -->
    <div id="view-stats" class="hidden">
      <div class="section-head" style="border:none;padding-left:0;">Overview</div>
      <div class="gauge-card" id="statsOverview" style="margin-top:6px;"></div>

      <div class="section" style="margin-top:6px;">
        <div class="section-head">By Strategy</div>
        <div class="section-body" id="statsStrategy" style="padding-top:4px;"></div>
      </div>

      <div class="section">
        <div class="section-head">Cleared vs. Override</div>
        <div class="section-body" id="statsDiscipline" style="padding-top:4px;"></div>
      </div>

      <div class="section">
        <div class="section-head">Matched Framework?</div>
        <div class="section-body" id="statsFramework" style="padding-top:4px;"></div>
      </div>

      <div class="section">
        <div class="section-head">Profit Target Hit Rate</div>
        <div class="section-body" id="statsTarget" style="padding-top:4px;"></div>
      </div>
    </div>

  </div>

  <nav class="bottom">
    <div class="inner">
      <button class="navbtn active" data-view="ticket"><span class="dot"></span>New Ticket</button>
      <button class="navbtn" data-view="log"><span class="dot"></span>Log Book</button>
      <button class="navbtn" data-view="dash"><span class="dot"></span>Dashboard</button>
      <button class="navbtn" data-view="stats"><span class="dot"></span>Stats</button>
    </div>
  </nav>
</div>

<script>
(function(){

  let trades = [];
  let settings = { cash: 10000, capPct: 125, sectorWarnPct: 40, lowIvrPct: 30 };

  const $ = id => document.getElementById(id);

  async function loadData(){
    try{
      const t = localStorage.getItem('td_trades');
      trades = t ? JSON.parse(t) : [];
    }catch(e){ trades = []; }
    try{
      const s = localStorage.getItem('td_settings');
      if(s) settings = JSON.parse(s);
    }catch(e){ /* use defaults */ }
    renderAll();
  }
  async function saveTrades(){
    try{
      localStorage.setItem('td_trades', JSON.stringify(trades));
    }catch(e){
      console.error('save failed', e);
      alert('Save failed: '+(e && e.message ? e.message : 'unknown error')+'. Your last change may not have persisted.');
    }
  }
  async function saveSettingsToStore(){
    try{
      localStorage.setItem('td_settings', JSON.stringify(settings));
    }catch(e){
      console.error('save failed', e);
      alert('Save failed: '+(e && e.message ? e.message : 'unknown error'));
    }
  }

  function openTrades(){ return trades.filter(t=>t.status==='open'); }

  function leverageUsed(excludeId){
    return openTrades().filter(t=>t.id!==excludeId).reduce((sum,t)=> sum + ((Number(t.callcost)||0) * (Number(t.contracts)||1)), 0);
  }

  function sectorCounts(excludeId){
    const counts = {};
    openTrades().filter(t=>t.id!==excludeId).forEach(t=>{
      counts[t.sector] = (counts[t.sector]||0)+1;
    });
    return counts;
  }

  function fmtMoney(n){ return '$' + (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0}); }
  function fmtPct(n){ return (Math.round(n*10)/10) + '%'; }

  function gaugeHTML(label, usedPct, valueText, color){
    usedPct = Math.max(0, Math.min(100, usedPct));
    return `<div class="gauge-row"><span class="gauge-label">${label}</span><span class="gauge-value">${valueText}</span></div>
    <div class="gauge-track"><div class="gauge-fill" style="width:${usedPct}%;background:${color};"></div></div>`;
  }

  function computeLeverage(newCost, excludeId){
    const budget = settings.cash * settings.capPct/100;
    const used = leverageUsed(excludeId);
    const projected = used + (Number(newCost)||0);
    const remaining = budget - projected;
    const usedPct = budget>0 ? (projected/budget*100) : 0;
    return {budget, used, projected, remaining, usedPct};
  }

  function renderLiveGauges(){
    const cost = (Number($('f_callcost').value)||0) * (Number($('f_contracts').value)||1);
    const sector = $('f_sector').value;
    const lev = computeLeverage(cost, null);
    const color = lev.usedPct>100 ? 'var(--breach)' : (lev.usedPct>85 ? 'var(--warn)' : 'var(--pass)');
    let html = gaugeHTML('Leverage budget (incl. this ticket)', lev.usedPct, fmtMoney(Math.max(lev.remaining,0))+' left · '+fmtPct(lev.usedPct), color);

    const counts = sectorCounts(null);
    counts[sector] = (counts[sector]||0)+1;
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    const thisPct = total>0 ? (counts[sector]/total*100) : 0;
    const scolor = (total>=3 && thisPct>settings.sectorWarnPct) ? 'var(--warn)' : 'var(--pass)';
    html += `<div style="margin-top:14px;">`+gaugeHTML(sector+' exposure (incl. this ticket)', thisPct, counts[sector]+' of '+total+' open · '+fmtPct(thisPct), scolor)+`</div>`;
    $('liveGauges').innerHTML = html;
  }

  function evaluateGates(){
    const gates = [];
    const ivr = Number($('f_ivr').value)||0;
    const ivrReason = $('f_ivrReason').value;
    const daysE = Number($('f_daysEarnings').value);
    const daysX = Number($('f_daysExp').value);
    const structure = $('f_structure').value;
    const strategy = $('f_strategy').value;
    const haslevel = $('f_haslevel').value;
    const delta = Number($('f_delta').value);
    const cost = (Number($('f_callcost').value)||0) * (Number($('f_contracts').value)||1);
    const sector = $('f_sector').value;

    // Gate 1: low IVR + earnings inside window
    const earningsInWindow = (!isNaN(daysE) && !isNaN(daysX) && $('f_daysEarnings').value!=='' && $('f_daysExp').value!=='' && daysE <= daysX);
    if(earningsInWindow && (ivr < settings.lowIvrPct || ivrReason==='earnings')){
      gates.push({level:'breach', title:'Event-driven vol + earnings in window', msg:`IVR is ${ivr||'—'}% and earnings fall inside your expiration window. This is the compounded-risk setup: event-priced IV with no mean-reversion cushion.`});
    }

    // Gate 2: sector concentration (only meaningful once there's an actual portfolio to be concentrated within)
    const counts = sectorCounts(null);
    counts[sector] = (counts[sector]||0)+1;
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    const pct = total>0 ? (counts[sector]/total*100) : 0;
    if(total >= 3 && pct > settings.sectorWarnPct){
      gates.push({level:'warn', title:'Sector concentration', msg:`This trade brings ${sector} to ${counts[sector]} of ${total} open positions (${fmtPct(pct)}), above your ${settings.sectorWarnPct}% threshold.`});
    }

    // Gate 3: naked roll on a strategy that should be defined-risk
    if(structure==='naked' && (strategy==='IVR Mean-Reversion Spread' || strategy==='Orderflow-Directional')){
      gates.push({level:'breach', title:'Undefined-risk position', msg:`This ${strategy} trade has lost its long-leg protection. This is the exact moment a defined-risk spread turns into open-ended exposure.`});
    }

    // Gate 4: no support/resistance on directional trades
    if(haslevel==='no' && strategy==='Orderflow-Directional'){
      gates.push({level:'warn', title:'No technical level identified', msg:`No support/resistance level marked. Without one, there's no objective invalidation point for this thesis.`});
    }

    // Gate 5: deep ITM delta on PMCC short call
    if(strategy==='PMCC Repair' && !isNaN(delta) && $('f_delta').value!=='' && delta >= 0.70){
      gates.push({level:'warn', title:'Deep ITM short call', msg:`Delta ${delta} is deep ITM. Minimal extrinsic value means little theta harvested — this behaves like a hedge, not an income trade.`});
    }

    // Gate 6: leverage budget
    const lev = computeLeverage(cost, null);
    if(lev.usedPct > 100){
      gates.push({level:'breach', title:'Leverage budget exceeded', msg:`This trade pushes cumulative usage to ${fmtPct(lev.usedPct)} of your ${fmtMoney(lev.budget)} budget — ${fmtMoney(lev.projected-lev.budget)} over.`});
    }

    return gates;
  }

  function renderGates(){
    const gates = evaluateGates();
    const box = $('gatesBox');
    if(gates.length===0){ box.innerHTML=''; $('submitTicket').disabled=false; return; }
    let html = '';
    gates.forEach(g=>{
      html += `<div class="gate ${g.level}"><div class="gt-title">${g.level==='breach'?'⛔':'⚠'} ${g.title}</div>${g.msg}</div>`;
    });
    html += `<label class="ack"><input type="checkbox" id="ackBox"> I see the flag(s) above and am proceeding with this trade anyway.</label>`;
    box.innerHTML = html;
    $('submitTicket').disabled = true;
    $('ackBox').addEventListener('change', e=>{ $('submitTicket').disabled = !e.target.checked; });
  }

  function ivrColorFor(ivrVal){
    const thresh = settings.lowIvrPct;
    const buffer = 10; // points below threshold still counted as "close"
    if(ivrVal >= thresh) return 'var(--pass)';
    if(ivrVal >= thresh - buffer) return 'var(--warn)';
    return 'var(--breach)';
  }
  function updateIvrIndicator(){
    const input = $('f_ivr');
    const val = input.value;
    if(val===''){ input.style.borderColor=''; input.style.boxShadow=''; return; }
    const color = ivrColorFor(Number(val));
    input.style.borderColor = color;
    input.style.boxShadow = 'inset 0 0 0 1px '+color;
  }

  function refreshTicketForm(){ renderLiveGauges(); renderGates(); updateIvrIndicator(); }

   'f_price','f_delta','f_callcost','f_structure','f_optiontype','f_expdate','f_shortstrike','f_longstrike',
   'f_haslevel','f_levelprice',

    $('wrap_longstrike').classList.toggle('hidden', !isSpread);

  let targetTouched = false;
  $('f_target').addEventListener('input', ()=>{ targetTouched = true; });

    const d = Number($('f_daysExp').value);

    if(d <= 17){ $('f_target').value = 100; $('targetHint').textContent = 'Weekly/biweekly wheel range detected — defaulted to 100% of premium.'; }
    else if(d >= 30 && d <= 60){ $('f_target').value = 50; $('targetHint').textContent = '~45-day spread range detected — defaulted to 50% of premium.'; }
    else { $('targetHint').textContent = 'Default: 100% for weekly/biweekly wheel trades, 50% for ~45-day spreads — edit as needed.'; }
  });

  $('submitTicket').addEventListener('click', async ()=>{
    if($('submitTicket').disabled) return;
    const symbol = $('f_symbol').value.trim().toUpperCase();
    if(!symbol){ alert('Symbol is required.'); return; }
    const gates = evaluateGates();
    const trade = {
      id: 'T'+Date.now(),
      symbol, contracts: $('f_contracts').value || 1, sector: $('f_sector').value, strategy: $('f_strategy').value,
      ivr: $('f_ivr').value, ivrReason: $('f_ivrReason').value,
      daysEarnings: $('f_daysEarnings').value, daysExp: $('f_daysExp').value,
      price: $('f_price').value, delta: $('f_delta').value, callcost: $('f_callcost').value,

      optiontype: $('f_optiontype').value, expdate: $('f_expdate').value,
      shortstrike: $('f_shortstrike').value, longstrike: $('f_structure').value==='defined' ? $('f_longstrike').value : '',
      haslevel: $('f_haslevel').value, levelprice: $('f_levelprice').value,

      parentId: pendingLinkParentId || null, childId: null
    };
    trades.unshift(trade);
    recomputeCumulativePremium(trade);
    if(pendingLinkParentId){
      const parent = trades.find(t=>t.id===pendingLinkParentId);
      if(parent) parent.childId = trade.id;

  function recomputeCumulativePremium(trade){
    const contracts = Number(trade.contracts)||1;
    let total = (Number(trade.entry)||0)*contracts;
    (trade.rolls||[]).forEach(r=>{
      if(r.type==='rolled' && r.premium){ total += Number(r.premium)*contracts; }
    });
    trade.cumulativePremium = total;
    return total;
  }

  function capitalAtRiskFor(trade){
    const contracts = Number(trade.contracts)||1;
    if(trade.structure==='defined' && trade.shortstrike && trade.longstrike){
      const width = Math.abs(Number(trade.shortstrike)-Number(trade.longstrike));
      const maxLoss = width*100*contracts - (Number(trade.cumulativePremium)||((Number(trade.entry)||0)*contracts));
      return maxLoss>0 ? maxLoss : null;
    }
    if(trade.strategy==='PMCC Repair' && trade.callcost){
      return Number(trade.callcost)*contracts;
    }
    return null; // undefined risk (naked put) — no clean basis to auto-calc
  }

                      <button style="background:none;border:none;padding:0;font-size:10.5px;color:var(--muted);text-decoration:underline;cursor:pointer;font-family:'IBM Plex Mono',monospace;" data-editroll="${key}">Edit</button>
                      <button style="background:none;border:none;padding:0;font-size:10.5px;color:var(--breach);text-decoration:underline;cursor:pointer;font-family:'IBM Plex Mono',monospace;" data-deleteroll="${key}">Delete</button>
                      ${r.type==='pmcc' ? `<button style="background:none;border:none;padding:0;font-size:10.5px;color:#4C7EF3;text-decoration:underline;cursor:pointer;font-family:'IBM Plex Mono',monospace;" data-startpmcc="${t.id}">Start linked PMCC ticket</button>` : ''}
                    </div>
                  </div>`;
                }).join('')}
              </div>

              <div class="row2">
                <select class="rolltype-select" data-ticket="${t.id}" id="rolltype-${t.id}" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;">
                  <option value="rolled">Rolled out in time</option>
                  <option value="closed">Closed for profit</option>
                  <option value="pmcc">Converted to PMCC</option>
                  <option value="assigned">Assigned</option>
                  <option value="other">Other</option>
                </select>
              </div>
              ${t.status==='closed' ? `<div class="helptext">This position is already closed. Only add another adjustment here to correct the record or log a reopen.</div>` : ''}
              <div id="rolldetail-${t.id}" style="display:flex;flex-direction:column;gap:8px;">
                <div class="row2">
                  <input type="number" step="0.5" placeholder="New strike (blank = unchanged)" id="rollstrike-${t.id}" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;">
                  <input type="date" id="rollexp-${t.id}" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;">
                </div>
                <div class="row2">
                  <input type="number" step="0.01" placeholder="New delta" id="rolldelta-${t.id}" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;">
                  <input type="number" step="0.01" placeholder="Credit collected on roll (per contract $)" id="rollpremium-${t.id}" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;">
                </div>
              </div>
              <div id="closedetail-${t.id}" class="hidden" style="display:flex;flex-direction:column;gap:8px;">
                <div class="row2">
                  <input type="number" step="0.01" placeholder="Debit paid to close (per contract $)" id="closecost-${t.id}" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;">
                  <input type="number" step="0.01" placeholder="Underlying price at close" id="closeprice-${t.id}" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;">
                </div>
                <div class="helptext">P&amp;L auto-calculates: premium collected minus debit paid to close, and fills in Outcome below.</div>
              </div>
              <input type="text" placeholder="Note (optional)" id="rollnote-${t.id}" style="width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;">
              <button class="btn btn-ghost btn-small" id="addbtn-${t.id}" data-addroll="${t.id}">+ Add Adjustment</button>
              `}

            </div>
          </div>

          <div style="border:1px solid var(--line);border-radius:9px;overflow:hidden;">
            <div style="padding:10px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--pass);background:var(--panel-2);border-bottom:1px solid var(--line);">Trade Result</div>
            <div style="padding:12px;display:flex;flex-direction:column;gap:12px;">
              <div class="row2">
                <div class="field"><label>Status</label>
                  <select data-f="status"><option value="open" ${t.status==='open'?'selected':''}>Open</option><option value="closed" ${t.status==='closed'?'selected':''}>Closed</option></select>
                </div>
                <div class="field"><label>Matched framework?</label>
                  <select data-f="matched"><option value="">—</option><option value="yes" ${t.matched==='yes'?'selected':''}>Yes</option><option value="no" ${t.matched==='no'?'selected':''}>No</option></select>
                </div>
              </div>
              <div class="row2">
                <div class="field"><label>Outcome ($)</label><input type="number" step="0.01" value="${t.outcome||''}" data-f="outcome"></div>
                <div class="field"><label>Return on capital (%)</label><input type="number" step="0.1" value="${t.returnPct||''}" data-f="returnPct"></div>
              </div>
              <div class="helptext" style="margin-top:-4px;">Both auto-fill from a "Closed for profit" adjustment above (return % only for defined-risk spreads and PMCC trades — undefined for naked puts). Override here if needed.</div>
            </div>
          </div>

          <div class="helptext" style="text-align:center;">Adjustments above save immediately when logged. Use Save Changes below for edits to trade details, deviation notes, or trade result overrides.</div>
          <button class="btn btn-primary btn-small" data-save="${t.id}">Save Changes</button>
        </div>
      </div>`;
    }).join('');

    list.querySelectorAll('[data-jump]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        jumpToTicket(el.dataset.jump);
      });
    });
    list.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.dataset.toggle;
        if(expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
        renderLog();
      });
    });
    list.querySelectorAll('[data-kebab]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.dataset.kebab;
        openMenuId = (openMenuId===id) ? null : id;
        renderLog();
      });
    });
    list.querySelectorAll('[data-editbtn]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.dataset.editbtn;
        if(editModeIds.has(id)) editModeIds.delete(id); else editModeIds.add(id);
        expandedIds.add(id);
        openMenuId = null;
        renderLog();
      });
    });
    list.querySelectorAll('.rolltype-select').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const id = sel.dataset.ticket;
        $('rolldetail-'+id).classList.toggle('hidden', sel.value !== 'rolled');
        $('closedetail-'+id).classList.toggle('hidden', sel.value !== 'closed');
        const btn = $('addbtn-'+id);
        if(sel.value==='closed'){
          btn.textContent = 'Close Position';
          btn.className = 'btn btn-small';
          btn.style.background = 'var(--pass)';
          btn.style.color = '#0a1f16';
          btn.style.border = 'none';
        } else {
          btn.textContent = '+ Add Adjustment';
          btn.className = 'btn btn-ghost btn-small';
          btn.style.background = '';
          btn.style.color = '';
          btn.style.border = '';
        }
      });
    });
    list.querySelectorAll('.subtab-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        subTabState[btn.dataset.ticket] = btn.dataset.subtab;
        renderLog();
      });
    });
    list.querySelectorAll('[data-editroll]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        editingRollKey = btn.dataset.editroll;
        editingRollTypeOverride = null;
        renderLog();
      });
    });
    list.querySelectorAll('.edit-rolltype-select').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        editingRollTypeOverride = sel.value;
        renderLog();
      });
    });
    list.querySelectorAll('[data-cancelroll]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        editingRollKey = null;
        editingRollTypeOverride = null;
        renderLog();
      });
    });
    list.querySelectorAll('[data-deleteroll]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        if(!confirm('Delete this adjustment entry?')) return;
        const [tid, idxStr] = btn.dataset.deleteroll.split(':');
        const idx = Number(idxStr);
        const trade = trades.find(t=>t.id===tid);
        trade.rolls.splice(idx, 1);
        recomputeCumulativePremium(trade);
        editingRollKey = null;
        editingRollTypeOverride = null;
        await saveTrades();
        renderLog();
      });
    });
    list.querySelectorAll('[data-saveroll]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const [tid, idxStr] = btn.dataset.saveroll.split(':');
        const idx = Number(idxStr);
        const trade = trades.find(t=>t.id===tid);
        const r = trade.rolls[idx];
        const newType = $('editrolltype-'+idx+'-'+tid).value;
        r.type = newType;
        r.note = $('editnote-'+idx+'-'+tid).value.trim();
        if(newType==='rolled'){
          const strikeEl = $('editstrike-'+idx+'-'+tid), expEl = $('editexp-'+idx+'-'+tid), deltaEl = $('editdelta-'+idx+'-'+tid), premEl = $('editpremium-'+idx+'-'+tid);
          r.strike = strikeEl.value || '';
          r.expdate = expEl.value || '';
          r.delta = deltaEl.value || '';
          r.premium = premEl.value || '';
          if(strikeEl.value) trade.shortstrike = strikeEl.value;
          if(expEl.value) trade.expdate = expEl.value;
          if(deltaEl.value) trade.delta = deltaEl.value;
        }
        if(newType==='closed'){
          const costEl = $('editclosecost-'+idx+'-'+tid), priceEl = $('editcloseprice-'+idx+'-'+tid);
          r.closeCost = costEl.value || '';
          r.closePrice = priceEl.value || '';
          if(costEl.value){
            const contracts = Number(trade.contracts)||1;
            const totalCredit = recomputeCumulativePremium(trade);
            const pl = totalCredit - (Number(costEl.value)*contracts);
            trade.outcome = pl.toFixed(2);
            const risk = capitalAtRiskFor(trade);
            if(risk) trade.returnPct = ((pl/risk)*100).toFixed(1);
          }
        }
        recomputeCumulativePremium(trade);
        editingRollKey = null;
        editingRollTypeOverride = null;
        await saveTrades();
        renderAll();
      });
    });
    list.querySelectorAll('[data-addroll]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const id = btn.dataset.addroll;
        const noteEl = $('rollnote-'+id);
        const typeEl = $('rolltype-'+id);
        const trade = trades.find(t=>t.id===id);
        trade.rolls = trade.rolls||[];
        const rollEntry = {date: new Date().toISOString(), type: typeEl.value, note: noteEl.value.trim()};

        if(typeEl.value==='rolled'){
          const strikeEl = $('rollstrike-'+id), expEl = $('rollexp-'+id), deltaEl = $('rolldelta-'+id), premEl = $('rollpremium-'+id);
          if(strikeEl.value){ rollEntry.strike = strikeEl.value; trade.shortstrike = strikeEl.value; }
          if(expEl.value){ rollEntry.expdate = expEl.value; trade.expdate = expEl.value; }
          if(deltaEl.value){ rollEntry.delta = deltaEl.value; trade.delta = deltaEl.value; }
          if(premEl.value){ rollEntry.premium = premEl.value; }
          strikeEl.value=''; expEl.value=''; deltaEl.value=''; premEl.value='';
        }
        if(typeEl.value==='closed'){
          const costEl = $('closecost-'+id), priceEl = $('closeprice-'+id);
          const contracts = Number(trade.contracts)||1;
          const totalCredit = recomputeCumulativePremium(trade);
          if(costEl.value){
            rollEntry.closeCost = costEl.value;
            const pl = totalCredit - (Number(costEl.value)*contracts);
            trade.outcome = pl.toFixed(2);
            const risk = capitalAtRiskFor(trade);
            if(risk) trade.returnPct = ((pl/risk)*100).toFixed(1);
            rollEntry.note = (rollEntry.note ? rollEntry.note+' — ' : '') + `Closed for $${costEl.value}/contract debit, P&L $${pl.toFixed(2)}`;
          }
          if(priceEl.value){ rollEntry.closePrice = priceEl.value; }
          costEl.value=''; priceEl.value='';
        }

        trade.rolls.push(rollEntry);
        recomputeCumulativePremium(trade);
        if(typeEl.value==='closed' || typeEl.value==='assigned'){ trade.status = 'closed'; trade.closedDate = trade.closedDate || new Date().toISOString(); }
        noteEl.value = '';
        await saveTrades();
        renderLog();
      });
    });
    list.querySelectorAll('[data-startpmcc]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const src = trades.find(t=>t.id===btn.dataset.startpmcc);
        if(!src) return;
        pendingLinkParentId = src.id;
        setView('ticket');
        $('f_symbol').value = src.symbol||'';
        $('f_sector').value = src.sector||'Retail';
        $('f_strategy').value = 'PMCC Repair';
        $('f_contracts').value = src.contracts||1;
        $('f_thesis').value = `Converted from naked put on ${src.symbol} (originally logged ${new Date(src.dateOpened).toLocaleDateString()}).`;
        refreshTicketForm();
        window.scrollTo(0,0);
      });
    });
    list.querySelectorAll('[data-save]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const id = btn.dataset.save;
        const trade = trades.find(t=>t.id===id);
        const body = $('body-'+id);
        body.querySelectorAll('[data-f]').forEach(el=>{
          const key = el.dataset.f;
          if(el.type==='checkbox') trade[key] = el.checked;
          else trade[key] = el.value;
        });
        if(trade.status==='closed' && !trade.closedDate) trade.closedDate = new Date().toISOString();
        recomputeCumulativePremium(trade);
        editModeIds.delete(id);
        await saveTrades();
        renderAll();
      });
    });
    list.querySelectorAll('[data-delete]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        if(!confirm('Delete this ticket permanently?')) return;
        const delId = btn.dataset.delete;
        trades.forEach(t=>{
          if(t.parentId===delId) t.parentId = null;
          if(t.childId===delId) t.childId = null;
        });
        trades = trades.filter(t=>t.id!==delId);
        openMenuId = null;
        await saveTrades();
        renderAll();
      });
    });
  }

  let pendingLinkParentId = null;

  document.addEventListener('click', (e)=>{
    if(openMenuId && !e.target.closest('.kebab-wrap')){
      openMenuId = null;
      renderLog();
    }
  });

  // DASHBOARD
  function renderDash(){
    const lev = computeLeverage(0, null);
    const color = lev.usedPct>100?'var(--breach)':(lev.usedPct>85?'var(--warn)':'var(--pass)');
    $('dashLeverage').innerHTML = gaugeHTML('Budget: '+fmtMoney(lev.budget)+' ('+settings.capPct+'% of '+fmtMoney(settings.cash)+')', lev.usedPct, fmtMoney(lev.used)+' used · '+fmtMoney(Math.max(lev.remaining,0))+' left', color);

    const counts = sectorCounts(null);
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    if(total===0){
      $('dashSector').innerHTML = '<div class="empty" style="padding:10px 0;">No open positions.</div>';
    } else {
      let html = '';
      const colors = ['#C98A3B','#35B88A','#4C7EF3','#E3B341','#E0554F','#8B92A0','#7ED4C7'];
      let i=0;
      html += `<div class="gauge-track" style="height:14px;">`;
      Object.entries(counts).forEach(([sec,c])=>{
        html += `<div class="gauge-fill" style="width:${c/total*100}%;background:${colors[i%colors.length]};"></div>`;
        i++;
      });
      html += `</div><div class="seg-list">`;
      i=0;
      Object.entries(counts).forEach(([sec,c])=>{
        html += `<div class="seg-pill" style="border-color:${colors[i%colors.length]};color:${colors[i%colors.length]};">${sec} ${fmtPct(c/total*100)}</div>`;
        i++;
      });
      html += `</div>`;
      $('dashSector').innerHTML = html;
    }

    $('s_cash').value = settings.cash;
    $('s_cap').value = settings.capPct;
    $('s_sector').value = settings.sectorWarnPct;
    $('s_ivr').value = settings.lowIvrPct;
  }

  $('saveSettings').addEventListener('click', async ()=>{
    settings.cash = Number($('s_cash').value)||settings.cash;
    settings.capPct = Number($('s_cap').value)||settings.capPct;
    settings.sectorWarnPct = Number($('s_sector').value)||settings.sectorWarnPct;
    settings.lowIvrPct = Number($('s_ivr').value)||settings.lowIvrPct;
    await saveSettingsToStore();
    renderAll();
    $('saveSettings').textContent = 'Saved ✓';
    setTimeout(()=>{ $('saveSettings').textContent='Save Settings'; }, 1200);
  });

  $('exportData').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify({trades, settings}, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'trade-desk-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  $('importTrigger').addEventListener('click', ()=>{ $('importFile').click(); });
  $('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.trades || !data.settings) throw new Error('File missing expected trades/settings data.');
        if(!confirm('This will replace your current '+trades.length+' ticket(s) with '+data.trades.length+' from the backup file. Continue?')) return;
        trades = data.trades;
        settings = data.settings;
        await saveTrades();
        await saveSettingsToStore();
        renderAll();
        alert('Import complete.');
      }catch(err){
        alert('Import failed: '+err.message);
      }
      $('importFile').value = '';
    };
    reader.readAsText(file);
  });

  function bucketBy(keyFn, closedList){
    const map = {};
    closedList.forEach(t=>{
      const k = keyFn(t);
      if(!map[k]) map[k] = {count:0, wins:0, withOutcome:0, totalPL:0};
      map[k].count++;
      if(t.outcome!=='' && t.outcome!=null && !isNaN(Number(t.outcome))){
        map[k].withOutcome++;
        map[k].totalPL += Number(t.outcome);
        if(Number(t.outcome)>0) map[k].wins++;
      }
    });
    return map;
  }

  function renderBucketRows(map){
    const keys = Object.keys(map);
    if(keys.length===0) return '<div class="empty" style="padding:14px 0;">No closed trades yet.</div>';
    return keys.map(k=>{
      const b = map[k];
      const wr = b.withOutcome ? (b.wins/b.withOutcome*100) : null;
      const plColor = b.totalPL>0?'var(--pass)':(b.totalPL<0?'var(--breach)':'var(--muted)');
      return `<div class="bucket-row"><div class="name">${k}</div><div class="stats">${b.count} trade${b.count!==1?'s':''}${wr!==null ? ' · '+fmtPct(wr)+' win' : ''} · <span style="color:${plColor};">${fmtMoney(b.totalPL)}</span></div></div>`;
    }).join('');
  }

  function renderStats(){
    const closed = trades.filter(t=>t.status==='closed');
    const withOutcome = closed.filter(t=>t.outcome!=='' && t.outcome!=null && !isNaN(Number(t.outcome)));
    const wins = withOutcome.filter(t=>Number(t.outcome)>0).length;
    const winRate = withOutcome.length ? (wins/withOutcome.length*100) : null;
    const totalPL = withOutcome.reduce((s,t)=>s+Number(t.outcome),0);
    const rVals = closed.filter(t=>t.returnPct!=='' && t.returnPct!=null && !isNaN(Number(t.returnPct))).map(t=>Number(t.returnPct));
    const avgR = rVals.length ? (rVals.reduce((a,b)=>a+b,0)/rVals.length) : null;

    $('statsOverview').innerHTML = `<div class="stat-grid">
      <div class="stat-box"><div class="num">${closed.length}</div><div class="lbl">Closed trades</div></div>
      <div class="stat-box"><div class="num">${winRate!==null ? fmtPct(winRate) : '—'}</div><div class="lbl">Win rate</div></div>
      <div class="stat-box"><div class="num" style="color:${totalPL>0?'var(--pass)':(totalPL<0?'var(--breach)':'var(--text)')};">${withOutcome.length ? fmtMoney(totalPL) : '—'}</div><div class="lbl">Total P&amp;L</div></div>
      <div class="stat-box"><div class="num">${avgR!==null ? avgR.toFixed(1)+'%' : '—'}</div><div class="lbl">Avg Return on Capital</div></div>
    </div>`;

    $('statsStrategy').innerHTML = renderBucketRows(bucketBy(t=>t.strategy||'Unspecified', closed));
    $('statsDiscipline').innerHTML = renderBucketRows(bucketBy(t=>(t.gatesAtEntry&&t.gatesAtEntry.length>0)?'Override (flagged at entry)':'Cleared (no flags)', closed));
    $('statsFramework').innerHTML = renderBucketRows(bucketBy(t=>t.matched==='yes'?'Matched framework':(t.matched==='no'?'Did not match':'Not tagged'), closed));

    const targetEligible = closed.filter(t=> t.entry && t.target && t.outcome!=='' && t.outcome!=null && !isNaN(Number(t.outcome)));
    if(targetEligible.length===0){
      $('statsTarget').innerHTML = '<div class="empty" style="padding:14px 0;">Needs premium collected, profit target %, and outcome $ filled in on closed trades.</div>';
    } else {
      let hit = 0;
      targetEligible.forEach(t=>{
        const totalEntry = Number(t.entry)*(Number(t.contracts)||1);
        const pctAchieved = Number(t.outcome)/totalEntry*100;
        if(pctAchieved >= Number(t.target)*0.95) hit++;
      });
      $('statsTarget').innerHTML = `<div class="bucket-row"><div class="name">Hit target</div><div class="stats">${hit} of ${targetEligible.length} closed trades (${fmtPct(hit/targetEligible.length*100)})</div></div>`;
    }
  }

  function renderAll(){
    refreshTicketForm();
    renderLog();
    renderDash();
    renderStats();
  }

  // NAV
  function setView(v){
    ['ticket','log','dash','stats'].forEach(name=>{
      $('view-'+name).classList.toggle('hidden', name!==v);
    });
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
    $('viewLabel').textContent = v==='ticket' ? 'New Ticket' : (v==='log' ? 'Log Book' : (v==='dash' ? 'Dashboard' : 'Trading Stats'));
    if(v==='log') renderLog();
    if(v==='dash') renderDash();
    if(v==='stats') renderStats();
  }
  document.querySelectorAll('.navbtn').forEach(b=>{
    b.addEventListener('click', ()=>setView(b.dataset.view));
  });

  $('dateNow').textContent = new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});

  loadData();
})();
</script>
</body>
</html>
